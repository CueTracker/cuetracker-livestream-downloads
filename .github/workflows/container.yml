name: Publish CueTracker container
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release version, without v
        required: true
        type: string
      source_sha256:
        description: Verified SHA256 of the released camera-studio.zip
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
    steps:
      - name: Fetch the approved release source
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --location --proto '=https' --proto-redir '=https' \
            "https://github.com/CueTracker/cuetracker-livestream-downloads/releases/download/v$VERSION/camera-studio.zip" -o source.zip
          echo "$SOURCE_SHA256  source.zip" | sha256sum --check
          unzip -q source.zip
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test before publishing
        run: |
          docker build -f cuetracker-camera-studio/Dockerfile.local \
            -t "ghcr.io/cuetracker/livestream:$VERSION" cuetracker-camera-studio
          docker run -d --name studio-test --network host "ghcr.io/cuetracker/livestream:$VERSION"
          for n in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8765/healthz > /tmp/health.json && break; sleep 1; done
          python -c "import json,os; h=json.load(open('/tmp/health.json')); assert h['version']==os.environ['VERSION'] and h['local_only']"
          docker stop studio-test
          docker push "ghcr.io/cuetracker/livestream:$VERSION"
